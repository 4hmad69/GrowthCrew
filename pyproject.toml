[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests", "frontend/tests"]
pythonpath = ["."]
markers = [
    "integration: requires the local PostgreSQL and pgvector service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"